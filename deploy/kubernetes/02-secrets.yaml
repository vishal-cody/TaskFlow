# WARNING: In production, use SealedSecrets, External Secrets Operator, or
# Vault to inject secrets. These base64-encoded values are for local/dev only.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: jobplatform
  labels:
    app.kubernetes.io/part-of: jobplatform
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:postgres@postgres.jobplatform.svc.cluster.local:5432/jobplatform?sslmode=disable"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.jobplatform.svc.cluster.local:5672/"
  REDIS_URL: "redis://redis.jobplatform.svc.cluster.local:6379/0"
  JWT_SECRET: "super-secret-change-in-production"
  POSTGRES_PASSWORD: "postgres"
