# Ingress — routes external traffic to the correct backend.
#
# Requires an ingress controller (e.g., ingress-nginx) to be installed:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0/deploy/static/provider/cloud/deploy.yaml
#
# Routes:
#   /api/*     → API service (port 8080)
#   /health/*  → API service (port 8080)
#   /*         → Frontend service (port 80)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobplatform-ingress
  namespace: jobplatform
  labels:
    app.kubernetes.io/part-of: jobplatform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: jobplatform.local
      http:
        paths:
          # API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          # Health probes (external monitoring)
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          # Frontend catch-all
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
