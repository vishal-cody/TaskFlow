apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: jobplatform
  labels:
    app.kubernetes.io/part-of: jobplatform
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'jobplatform-api'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: api
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: 8080

      - job_name: 'jobplatform-worker'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: worker
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: worker
        # Workers expose metrics on 8081, we need to rewrite the scrape target address.
        # This replaces the default port with 8081.
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:8081
            target_label: __address__
